# Publishes the public site to GitHub Pages: landing/ at the root and the web UI (web/dist) under
# app/. The edge Worker (ops/edge/worker.js) serves squint.nickymolina.com from it, so the site
# and the app shell stay up whatever the checking servers are doing.
name: site

on:
  push:
    branches: [main]
    paths: [landing/**, web/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: |
          mkdir -p _site/app
          cp -R landing/. _site/
          cp -R web/dist/. _site/app/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
